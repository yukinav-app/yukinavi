name: Update weather

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch weather
        run: python scripts/fetch_weather.py
      - name: Commit
        run: |
          git config user.name "yukinavi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet && exit 0
          git commit -m "Update weather"
          git pull --rebase
          git push
