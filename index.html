<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>YukiNav</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E2792B">
<meta name="description" content="スキー・スノボのゲレンデ選びを3問で診断するアプリ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YukiNav">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EEF1F4;
  --surface:#FFFFFF;
  --surface-2:#F7F9FB;
  --text:#1C2430;
  --text-muted:#5B6672;
  --border:#D7DEE5;
  --accent:#E2792B;
  --accent-ink:#7A3C10;
  --accent-soft:#FBE4CC;
  --good:#2F8F5B;
  --good-soft:#DCF0E6;
  --cold:#2E6B8A;
  --cold-soft:#DCEAF1;
  --navy:#1F3550;
  --navy-ink:#1F3550;
  --font-display:'Oswald',sans-serif;
  --font-body:'Work Sans',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121820; --surface:#1B232D; --surface-2:#212B36; --text:#EDEFF2; --text-muted:#9AA7B4;
    --border:#2C3844; --accent:#F0924A; --accent-ink:#2A1204; --accent-soft:#3A2412;
    --good:#4FBF86; --good-soft:#1C3A2B; --cold:#5FA8CC; --cold-soft:#1C3340; --navy-ink:#EDEFF2;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121820; --surface:#1B232D; --surface-2:#212B36; --text:#EDEFF2; --text-muted:#9AA7B4;
  --border:#2C3844; --accent:#F0924A; --accent-ink:#2A1204; --accent-soft:#3A2412;
  --good:#4FBF86; --good-soft:#1C3A2B; --cold:#5FA8CC; --cold-soft:#1C3340; --navy-ink:#EDEFF2;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
.num{font-variant-numeric:tabular-nums;}
.ic-svg{display:inline-block;vertical-align:-4px;flex:0 0 auto;}
button{font-family:inherit;}
a{color:inherit;}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0;}
.brand h1{font-size:22px;font-weight:700;letter-spacing:0.5px;color:var(--text);}
.brand .tagline{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;flex:0 0 auto;}
.lang-toggle button{border:none;background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;}
.lang-toggle button.active{background:var(--accent);color:#fff;}

/* bottom tab bar (native-app style) */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bottom-nav-inner{
  max-width:1080px;margin:0 auto;display:flex;
}
.nav-btn{
  flex:1 1 0;border:none;background:transparent;color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 10px;cursor:pointer;font-size:10.5px;font-weight:600;
}
.nav-btn .nav-ic{display:flex;line-height:1;}
.nav-btn .nav-ic .ic-svg{vertical-align:0;}
.nav-btn.active{color:var(--accent);}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));}
body.map-mode{overflow:hidden;}
body.map-mode main{padding:0;}

.search-row{padding-block:12px 12px;display:flex;gap:10px;flex-wrap:wrap;}
.search-box{flex:1 1 100%;position:relative;}
.filter-scroll{flex:1 1 100%;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll > *{flex:0 0 auto;}
.search-box input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;}
.search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}
select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13.5px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;user-select:none;white-space:nowrap;}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.chip input{display:none;}

main{padding-block:18px 24px;}
.view-title{font-size:20px;margin-bottom:4px;}
.view-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.result-count{color:var(--text-muted);font-size:13px;margin-bottom:12px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;}
.card:hover{border-color:var(--accent);}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card h3{font-size:18px;line-height:1.25;}
.region-tag{font-size:11px;color:var(--text-muted);margin-top:2px;}
.weather-chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:12.5px;background:var(--cold-soft);color:var(--cold);border-radius:999px;padding:4px 9px;}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--text-muted);}
.meta-row .dot{opacity:0.6;}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.price{font-family:var(--font-display);font-size:17px;}
.price .unit{font-family:var(--font-body);font-size:11.5px;color:var(--text-muted);font-weight:500;}
.badge{font-size:11px;font-weight:600;border-radius:7px;padding:3px 7px;}
.badge.student{background:var(--good-soft);color:var(--good);}

/* hero */
.hero{
  position:relative;overflow:hidden;isolation:isolate;border-radius:20px;margin-bottom:16px;min-height:250px;color:#fff;
  background:linear-gradient(180deg,#1B3556 0%,#33618C 42%,#8FB3D3 72%,#F1D6C4 100%);
}
.hero-svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:48%;z-index:0;}
.hero::before,.hero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:
    radial-gradient(1.6px 1.6px at 18px 22px,#fff 60%,transparent 62%),
    radial-gradient(1.2px 1.2px at 92px 64px,#fff 60%,transparent 62%),
    radial-gradient(2px 2px at 150px 18px,#fff 60%,transparent 62%),
    radial-gradient(1.4px 1.4px at 60px 140px,#fff 60%,transparent 62%),
    radial-gradient(1.8px 1.8px at 176px 120px,#fff 60%,transparent 62%),
    radial-gradient(1.2px 1.2px at 120px 176px,#fff 60%,transparent 62%);
  background-size:200px 200px;opacity:0.75;animation:hero-snow 14s linear infinite;
}
.hero::after{background-size:140px 140px;opacity:0.45;animation-duration:22s;}
@keyframes hero-snow{from{background-position:0 0;}to{background-position:-40px 200px;}}
@media (prefers-reduced-motion: reduce){.hero::before,.hero::after{animation:none;}}
.hero-content{position:relative;z-index:2;padding:22px 22px 20px;}
.hero h2{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:0.3px;text-shadow:0 2px 14px rgba(8,22,40,0.35);}
.hero p{margin:8px 0 0;font-size:13.5px;line-height:1.55;opacity:0.92;max-width:30ch;}
.hero-stat{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);border-radius:999px;padding:5px 11px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}

/* wizard */
.wizard-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px;}
.q-block{margin-bottom:20px;}
.q-label{font-size:14.5px;font-weight:600;margin-bottom:10px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.pill{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;cursor:pointer;}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.wizard-submit{width:100%;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;border-radius:12px;padding:14px;cursor:pointer;margin-top:4px;}
.wizard-submit:disabled{opacity:0.4;cursor:not-allowed;}

.reco-card{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:22px;margin-bottom:16px;}
.reco-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);display:inline-block;border-radius:999px;padding:4px 11px;margin-bottom:10px;}
.reco-card h2{font-size:26px;margin-bottom:4px;}
.reco-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.reco-approx-note{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:14px;}
.reco-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.reco-row{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:11px 13px;}
.reco-row .ic{font-size:18px;flex:0 0 auto;}
.reco-row .rt{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:2px;}
.reco-row .rv{font-size:13.5px;}
.packing-list{display:flex;flex-wrap:wrap;gap:6px;}
.packing-item{background:var(--cold-soft);color:var(--cold);border-radius:999px;padding:4px 10px;font-size:12px;}
.reco-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.reco-secondary-btn{flex:1 1 auto;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;}
.reco-detail-btn{flex:1 1 auto;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;}

/* full-screen map (Toku-style) */
.map-full{position:fixed;left:0;right:0;top:var(--hdr-h,64px);bottom:var(--nav-h,64px);z-index:5;background:#E8EEF3;}
#leafletMap{position:absolute;inset:0;}
.leaflet-container{font-family:var(--font-body);background:#E8EEF3;}
.map-top{position:absolute;top:10px;left:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.map-top > *{pointer-events:auto;}
.map-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 12px;box-shadow:0 4px 14px rgba(16,30,50,0.12);}
.map-search-ic{color:var(--text-muted);display:flex;}
.map-search input{flex:1;border:none;background:transparent;color:var(--text);font-size:15px;padding:12px 0;min-width:0;}
.map-search input:focus{outline:none;}
.map-suggest{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(16,30,50,0.14);}
.map-suggest button{display:flex;justify-content:space-between;gap:10px;width:100%;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);text-align:left;padding:11px 14px;font-size:14px;cursor:pointer;font-family:inherit;}
.map-suggest button:last-child{border-bottom:none;}
.map-suggest .sg-pref{color:var(--text-muted);font-size:12px;flex:0 0 auto;}
.map-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.map-chips::-webkit-scrollbar{display:none;}
.map-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(16,30,50,0.10);display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
.map-chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.map-ctrls{position:absolute;right:12px;bottom:70px;z-index:500;display:flex;flex-direction:column;gap:8px;}
.map-ctrl{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--navy-ink);font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(16,30,50,0.16);display:flex;align-items:center;justify-content:center;font-family:inherit;}
.map-count{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:500;background:rgba(22,36,54,0.88);color:#fff;font-size:12px;font-weight:600;letter-spacing:0.04em;border-radius:8px;padding:6px 12px;white-space:nowrap;}
.map-count .rd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;}
.pref-box{background:var(--navy);color:#fff;border:1.5px solid rgba(255,255,255,0.85);border-radius:6px;padding:2px 6px;text-align:center;font-size:10.5px;line-height:1.25;font-weight:600;box-shadow:0 3px 10px rgba(16,30,50,0.3);white-space:nowrap;cursor:pointer;transform:translate(-50%,-50%);display:inline-block;}
.pref-box .pc{font-family:var(--font-display);font-size:12px;letter-spacing:0.03em;}
.rpin{transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.rpin .rpin-dot{width:30px;height:30px;border-radius:50%;background:var(--accent);border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(16,30,50,0.35);}
.rpin.mini .rpin-dot{width:22px;height:22px;background:#fff;border:2px solid var(--navy);color:var(--navy);}
.rpin.sel .rpin-dot{transform:scale(1.25);background:#D93025;border-color:#fff;color:#fff;}
.rpin .rpin-label{display:none;margin-top:3px;background:rgba(255,255,255,0.92);color:#1C2430;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(16,30,50,0.2);}
.show-labels .rpin .rpin-label{display:block;}
.leaflet-div-icon.yn-icon{background:transparent;border:none;}
.me-dot{width:16px;height:16px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,0.2);transform:translate(-50%,-50%);}
.map-preview{position:absolute;left:10px;right:10px;bottom:56px;z-index:600;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(16,30,50,0.22);max-width:520px;margin:0 auto;}
.mp-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.mp-head h3{font-size:19px;line-height:1.2;}
.mp-sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
.mp-stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.mp-stat{background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--text-muted);}
.mp-stat b{display:block;font-family:var(--font-display);font-size:16px;color:var(--text);font-weight:600;}
.mp-note{font-size:12.5px;color:var(--text-muted);margin:10px 0;}
.mp-actions{display:flex;gap:8px;}
.mp-actions a,.mp-actions button{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.mp-primary{background:var(--accent);color:#fff;border:none;}
.mp-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.mini-terrain{display:flex;height:6px;border-radius:999px;overflow:hidden;margin-top:2px;}

/* favorites + snow */
.fav-btn{border:none;background:transparent;color:var(--text-muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;}
.fav-btn.on{color:#F2B01E;}
.star-ic{color:#F2B01E;}
.snow-badge{font-size:11px;font-weight:600;border-radius:7px;padding:3px 7px;background:var(--cold-soft);color:var(--cold);}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

/* deals tab */
.deal-section{margin-bottom:26px;}
.deal-section h3{font-size:17px;margin-bottom:10px;}
.deal-list{display:flex;flex-direction:column;gap:10px;}
.deal-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:8px;}
.deal-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;}
.deal-cat{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent-ink);}
.deal-cat.student{background:var(--good-soft);color:var(--good);}
.deal-cat.online{background:var(--cold-soft);color:var(--cold);}
.deal-until{font-size:12px;color:var(--text-muted);}
.deal-until.soon{color:#C2410C;font-weight:600;}
.deal-card h4{font-size:15.5px;margin:0;font-family:var(--font-body);font-weight:700;}
.deal-resort{font-size:12px;color:var(--text-muted);}
.deal-desc{font-size:13px;color:var(--text);margin:0;}
.deal-link{align-self:flex-start;background:var(--accent);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;border-radius:8px;padding:8px 12px;}
.stu-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit;}
.stu-row .sr-name{font-weight:600;font-size:14px;}
.stu-row .sr-pref{font-size:11.5px;color:var(--text-muted);}
.stu-row .sr-price{text-align:right;font-size:12px;color:var(--text-muted);flex:0 0 auto;}
.stu-row .sr-price b{font-family:var(--font-display);font-size:16px;color:var(--good);}
.deal-empty{background:var(--surface-2);border:1px dashed var(--border);border-radius:14px;padding:20px;text-align:center;color:var(--text-muted);font-size:13px;}

/* gear tab */
.gear-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.gear-tab-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.gear-tab-btn.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.gear-tab-btn .dot-missing{width:6px;height:6px;border-radius:50%;background:var(--text-muted);opacity:0.5;}
.gear-product-card{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:24px;text-align:center;}
.gear-product-ic{font-size:44px;margin-bottom:10px;}
.gear-product-name{font-size:18px;font-weight:700;margin-bottom:6px;}
.gear-product-tag{font-size:11.5px;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:999px;padding:3px 10px;display:inline-block;margin-bottom:14px;}
.gear-product-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:700;border-radius:10px;padding:12px 20px;}
.gear-empty-card{background:var(--surface-2);border:1px dashed var(--border);border-radius:18px;padding:28px;text-align:center;color:var(--text-muted);font-size:13.5px;}

/* detail overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,0.5);display:flex;justify-content:center;align-items:flex-end;z-index:50;padding-top:env(safe-area-inset-top,0px);}
.overlay[hidden]{display:none;}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px));}
@media (min-width:760px){.overlay{align-items:center;padding-top:0;} .sheet{border-radius:18px;max-height:88vh;margin-block:20px;}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}
.sheet-head h2{font-size:26px;}
.close-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer;flex:0 0 auto;}
.sheet-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.section-label{font-size:11.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.info-card{background:var(--surface-2);border-radius:12px;padding:12px;}
.info-card .big{font-family:var(--font-display);font-size:19px;}
.info-card .label{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.terrain-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-bottom:8px;}
.terrain-legend{display:flex;gap:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;margin-bottom:20px;}
.terrain-legend span{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block;}
.cta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px;}
.cta-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;}
.cta-card .cta-title{font-size:13.5px;font-weight:600;}
.cta-card .cta-desc{font-size:12px;color:var(--text-muted);flex:1;}
.cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--accent);color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 10px;}
.cta-btn:hover{opacity:0.9;}
.disclaimer{font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:14px;margin-top:6px;}
.empty{padding-block:40px;text-align:center;color:var(--text-muted);}
</style>
</head>
<body>

<header>

</header>

    </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="emptyState" hidden></div>
    </div>

    <div id="dealsView" hidden>

      <div class="view-sub" data-t="dealsSub"></div>
      <div id="dealsContent"></div>
    </div>

    <div id="mapView" class="map-full" hidden>

      <div class="map-count" id="mapCount"></div>
      <div class="map-preview" id="mapPreview" hidden></div>
    </div>

    <div id="gearView" hidden>

      <div class="view-sub" data-t="gearSub"></div>
      <div class="gear-tabs" id="gearTabs"></div>
      <div id="gearContent"></div>
    </div>

  </div>
</main>

<nav class="bottom-nav">

function icon(name, size){
  size = size || 18;
  return `<svg class="ic-svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||""}</svg>`;
}

function buildPills(container, items, groupKey, labelFn){
  const el = document.getElementById(container);
  el.innerHTML = items.map((item,i)=>`<button type="button" class="pill" data-group="${groupKey}" data-idx="${i}">${labelFn(item,i)}</button>`).join("");
  el.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click",()=>{
      el.querySelectorAll(".pill").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      wiz[groupKey] = Number(btn.dataset.idx);
      updateSubmitState();
    });
  });
}

function buildBlockPills(){
  const el = document.getElementById("pillBlock");
  el.innerHTML = REGION_BLOCKS.map(b=>{
    const label = state.lang==="ja" ? b.ja : b.en;
    const sel = wiz.block===b.id ? "sel" : "";
    return `<button type="button" class="pill ${sel}" data-block="${b.id}">${label}</button>`;
  }).join("");
  el.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      wiz.block = btn.dataset.block;
      wiz.prefIdx = null;
      el.querySelectorAll(".pill").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      document.getElementById("prefBlockWrap").hidden = false;
      buildPrefPills();
      updateSubmitState();
    });
  });
}

function matches(r){
  const q = state.query.trim().toLowerCase();
  const name = (state.lang==="ja" ? r.nameJa+r.prefJa : r.nameEn+" "+r.prefEn).toLowerCase();
  if(q && !name.includes(q)) return false;
  if(state.region!=="all" && r.region!==state.region) return false;
  if(state.studentOnly && !r.liftStudent) return false;
  if(state.englishOnly && r.english==="low") return false;
  if(state.favOnly && !isFav(r.id)) return false;
  return true;
}

function wmoToCondition(code){
  if([71,73,75,77,85,86].includes(code)) return {ja:"雪", en:"Snow"};
  if(code===0) return {ja:"快晴", en:"Clear"};
  if([1,2].includes(code)) return {ja:"晴れ", en:"Sunny"};
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {ja:"雨", en:"Rain"};
  if([95,96,99].includes(code)) return {ja:"雷雨", en:"Thunderstorm"};
  return {ja:"曇り", en:"Cloudy"};
}

function applyWeather(r, d){
  if(!d || !d.current) return;
  const cond = wmoToCondition(d.current.weather_code);
  const sf = (d.daily && d.daily.snowfall_sum) || [];
  r.weather = {
    tempC: Math.round(d.current.temperature_2m),
    condJa: cond.ja,
    condEn: cond.en,
    wind: Math.round(d.current.wind_speed_10m),
    depth: Math.round((d.current.snow_depth || 0) * 100),
    snowYesterday: sf.length ? Math.round(sf[0]) : null,
    snow7d: sf.length > 1 ? Math.round(sf.slice(1).reduce((a,b)=>a+(b||0),0)) : null,
    elevation: d.elevation!=null ? Math.round(d.elevation) : null,
  };
  r.liveWeather = true;
}

async function fetchWeatherBatch(list, useElev){
  for(let i=0;i<list.length;i+=50){
    const chunk = list.slice(i,i+50);
    const q = new URLSearchParams({
      latitude: chunk.map(r=>r.lat).join(","),
      longitude: chunk.map(r=>r.lng).join(","),
      current: "temperature_2m,weather_code,wind_speed_10m,snow_depth",
      daily: "snowfall_sum",
      past_days: "1",
      forecast_days: "7",
      timezone: "Asia/Tokyo",
    });
    if(useElev) q.set("elevation", chunk.map(r=>Math.round((r.base+r.top)/2)).join(","));
    try{
      const res = await fetch("https://api.open-meteo.com/v1/forecast?" + q.toString());
      if(!res.ok) throw new Error("weather http " + res.status);
      const data = await res.json();
      const arr = Array.isArray(data) ? data : [data];
      arr.forEach((d,j)=>applyWeather(chunk[j], d));
    }catch(err){
      console.warn("live weather batch failed", err);
    }
  }
}

async function loadAllLiveWeather(){
  const list = RESORTS.filter(r=>r.lat!=null && r.lng!=null);
  const withElev = list.filter(r=>r.base!=null && r.top!=null);
  const noElev = list.filter(r=>!(r.base!=null && r.top!=null));
  await Promise.all([fetchWeatherBatch(withElev,true), fetchWeatherBatch(noElev,false)]);
  render();
}

const NO_WX = {tempC:null,condJa:"",condEn:"",wind:null,depth:null,snowYesterday:null,snow7d:null,elevation:null};
function wx(r){ return r.weather || NO_WX; }
function nv(v, unit){ return v==null ? "—" : `${v}${unit||""}`; }
function weatherIcon(condJa){
  if(!condJa) return "";
  if(condJa.includes("雪")||condJa.includes("Snow")||condJa.includes("パウダー")||condJa.includes("Powder")) return icon("snow",18);
  if(condJa.includes("雨")||condJa.includes("Rain")||condJa.includes("雷")||condJa.includes("Thunderstorm")) return icon("cloud",18);
  if(condJa.includes("曇")||condJa.includes("Cloud")) return icon("cloud",18);
  return icon("sun",18);
}

function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeUrl(u){ return /^https:\/\//.test(u||"") ? escapeHtml(u) : "#"; }

function snowBadge(r){
  const w = r.weather;
  if(!w || w.snow7d==null || w.snow7d < 1) return "";
  return `<span class="snow-badge">${icon("snow",12)} ${t("snow7dShort")(w.snow7d)}</span>`;
}

function sortList(list){
  const arr = list.slice();
  if(state.sort==="snow") arr.sort((a,b)=>((b.weather&&b.weather.snow7d)||0)-((a.weather&&a.weather.snow7d)||0));
  else if(state.sort==="price") arr.sort((a,b)=>(a.liftAdult==null?1e9:a.liftAdult)-(b.liftAdult==null?1e9:b.liftAdult));
  else arr.sort((a,b)=>a.distKm-b.distKm);
  return arr;
}

function renderGrid(){
  const list = sortList(RESORTS.filter(matches));
  document.getElementById("resultCount").textContent = t("resultCount")(list.length);
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  if(list.length===0){
    grid.innerHTML="";
    empty.hidden=false;
    empty.textContent = state.favOnly && FAVS.size===0 ? t("favEmpty") : t("emptyState");
    return;
  }
  empty.hidden = true;
  grid.innerHTML = list.map(r=>{
    const name = state.lang==="ja" ? r.nameJa : r.nameEn;
    const pref = state.lang==="ja" ? r.prefJa : r.prefEn;
    const city = state.lang==="ja" ? r.cityJa : r.cityEn;
    const time = state.lang==="ja" ? r.timeJa : r.timeEn;
    const fav = isFav(r.id);
    return `
    <div class="card" role="button" tabindex="0" data-id="${r.id}">
      <div class="card-top">
        <div><h3>${name}</h3><div class="region-tag">${pref}</div></div>
        <div style="display:flex;align-items:center;gap:2px;flex:0 0 auto">
          <div class="weather-chip">${weatherIcon(wx(r).condJa)} <span class="num">${nv(wx(r).tempC,"°C")}</span></div>
          <button class="fav-btn ${fav?"on":""}" data-fav="${r.id}" aria-label="${t("favToggle")}" aria-pressed="${fav}">${fav?"★":"☆"}</button>
        </div>
      </div>
      <div class="meta-row">
        <span>${t("nearestFrom")}: ${city} <span class="num">${r.distKm}km</span></span>
        <span class="dot">・</span><span>${time}</span>
      </div>
      <div class="price-row">
        <div class="price">${r.liftAdult!=null ? `¥<span class="num">${r.liftAdult.toLocaleString()}</span> <span class="unit">${t("priceUnit")}</span>` : `<span class="unit">${t("priceUnknown")}</span>`}</div>
        <div class="card-badges">${snowBadge(r)}${r.liftStudent ? `<span class="badge student">${t("studentBadge")}</span>` : ""}</div>
      </div>
    </div>`;
  }).join("");

const PREF_EN = {"北海道":"Hokkaido","青森県":"Aomori","岩手県":"Iwate","宮城県":"Miyagi","秋田県":"Akita","山形県":"Yamagata","福島県":"Fukushima","茨城県":"Ibaraki","栃木県":"Tochigi","群馬県":"Gunma","埼玉県":"Saitama","千葉県":"Chiba","東京都":"Tokyo","神奈川県":"Kanagawa","新潟県":"Niigata","富山県":"Toyama","石川県":"Ishikawa","福井県":"Fukui","山梨県":"Yamanashi","長野県":"Nagano","岐阜県":"Gifu","静岡県":"Shizuoka","愛知県":"Aichi","三重県":"Mie","滋賀県":"Shiga","京都府":"Kyoto","大阪府":"Osaka","兵庫県":"Hyogo","奈良県":"Nara","和歌山県":"Wakayama","鳥取県":"Tottori","島根県":"Shimane","岡山県":"Okayama","広島県":"Hiroshima","山口県":"Yamaguchi","徳島県":"Tokushima","香川県":"Kagawa","愛媛県":"Ehime","高知県":"Kochi","福岡県":"Fukuoka","佐賀県":"Saga","長崎県":"Nagasaki","熊本県":"Kumamoto","大分県":"Oita","宮崎県":"Miyazaki","鹿児島県":"Kagoshima","沖縄県":"Okinawa"};
function prefLabel(ja){ return state.lang==="ja" ? ja : (PREF_EN[ja]||ja); }

function distKmBetween(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

let MAP_POINTS = [];
function buildMapPoints(){
  const main = RESORTS.filter(r=>r.lat!=null&&r.lng!=null).map(r=>({kind:"main", id:r.id, lat:r.lat, lng:r.lng, prefJa:r.prefJa, r}));
  const mini = [];
  ALL_RESORTS.forEach((x,i)=>{
    if(x.lat==null||x.lng==null) return;
    // 詳細データのあるスキー場と同じ場所（1.5km以内）は二重表示しない
    if(main.some(m=>distKmBetween(m,x)<1.5)) return;
    mini.push({kind:"mini", id:"a"+i, lat:x.lat, lng:x.lng, prefJa:x.pref, nameJa:x.name});
  });
  MAP_POINTS = main.concat(mini);
}
function pointName(p){ return p.kind==="main" ? (state.lang==="ja"?p.r.nameJa:p.r.nameEn) : p.nameJa; }

const MAP_FILTERS = [
  {id:"all", key:"mfAll", test:()=>true},
  {id:"detail", key:"mfDetail", test:p=>p.kind==="main"},
  {id:"beginner", key:"mfBeginner", test:p=>p.kind==="main" && !!p.r.terrain && p.r.terrain[0]>=40},
  {id:"snow", key:"mfSnow", test:p=>p.kind==="main" && !!p.r.weather && p.r.weather.snow7d>=5},
  {id:"student", key:"mfStudent", test:p=>p.kind==="main" && !!p.r.liftStudent},
  {id:"english", key:"mfEnglish", test:p=>p.kind==="main" && !!p.r.english && p.r.english!=="low"},

function initMap(){
  if(mapState.map || typeof L==="undefined") return;
  const m = L.map("leafletMap", {zoomControl:false, minZoom:5, maxZoom:16, zoomSnap:0.5, maxBounds:[[20,118],[50,154]], maxBoundsViscosity:0.8});
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
    maxZoom:18, maxNativeZoom:18,
    attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
  }).addTo(m);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png", {maxZoom:18, maxNativeZoom:16, opacity:0.28}).addTo(m);
  mapState.map = m;
  mapState.layer = L.layerGroup().addTo(m);
  if(m.getContainer().clientWidth < 640) m.setView([37.6,138.5], 5.6);
  else m.fitBounds([[31.0,129.6],[45.4,145.6]], {padding:[6,6]});
  m.on("moveend", renderMapLayer);
  m.on("click", closeMapPreview);
}

function visiblePoints(){
  const f = MAP_FILTERS.find(x=>x.id===mapState.filter) || MAP_FILTERS[0];
  return MAP_POINTS.filter(f.test);
}

function setMapCount(html){ document.getElementById("mapCount").innerHTML = `<span class="rd"></span>${html}`; }

function renderMapLayer(){
  const m = mapState.map;
  if(!m || state.view!=="map") return;
  const z = m.getZoom();
  const pts = visiblePoints();
  mapState.layer.clearLayers();
  m.getContainer().classList.toggle("show-labels", z>=10);
  if(z < 8){
    const groups = {};
    pts.forEach(p=>{
      const g = groups[p.prefJa] || (groups[p.prefJa]={n:0,lat:0,lng:0});
      g.n++; g.lat+=p.lat; g.lng+=p.lng;
    });
    Object.entries(groups).forEach(([pref,g])=>{
      const c = [g.lat/g.n, g.lng/g.n];
      const ic = L.divIcon({className:"yn-icon", html:`<div class="pref-box">${escapeHtml(prefLabel(pref))}<br><span class="pc">${g.n}</span></div>`, iconSize:null});
      L.marker(c,{icon:ic, title:prefLabel(pref)}).on("click",(e)=>{ L.DomEvent.stopPropagation(e); m.flyTo(c, 9.5); }).addTo(mapState.layer);
    });
    setMapCount(t("mapCountPref")(pts.length, Object.keys(groups).length));
    return;
  }
  const view = m.getBounds();
  const pad = view.pad(0.25);
  const near = pts.filter(p=>pad.contains([p.lat,p.lng]));
  near.sort((a,b)=> a.kind===b.kind ? 0 : (a.kind==="mini" ? -1 : 1));
  near.forEach(p=>{
    const sel = mapState.selected===p.id ? " sel" : "";
    const html = `<div class="rpin${p.kind==="mini"?" mini":""}${sel}"><span class="rpin-dot">${icon("mountain", p.kind==="main"?16:12)}</span><span class="rpin-label">${escapeHtml(pointName(p))}</span></div>`;
    const ic = L.divIcon({className:"yn-icon", html, iconSize:null});
    L.marker([p.lat,p.lng],{icon:ic, title:pointName(p), zIndexOffset: (p.kind==="main"?1000:0) + (sel?2000:0)})
      .on("click",(e)=>{ L.DomEvent.stopPropagation(e); selectMapPoint(p); })
      .addTo(mapState.layer);
  });
  const shown = pts.filter(p=>view.contains([p.lat,p.lng])).length;
  setMapCount(t("mapCountView")(shown, pts.length));
}

  document.getElementById("mapChips").innerHTML = MAP_FILTERS.map(f=>`<button class="map-chip ${mapState.filter===f.id?"on":""}" data-f="${f.id}">${t(f.key)}</button>`).join("");

  const el = document.getElementById("mapPreview");

  el.hidden = true;

function searchPoints(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  return MAP_POINTS.filter(p=>{
    const hay = (p.kind==="main" ? p.r.nameJa+" "+p.r.nameEn+" "+p.r.prefJa+" "+p.r.prefEn : p.nameJa+" "+p.prefJa+" "+(PREF_EN[p.prefJa]||"")).toLowerCase();
    return hay.includes(q);
  }).sort((a,b)=> a.kind===b.kind ? 0 : (a.kind==="main" ? -1 : 1)).slice(0,6);
}

function renderSuggest(){
  const box = document.getElementById("mapSuggest");
  const res = searchPoints(document.getElementById("mapSearch").value);
  if(!res.length){ box.hidden = true; box.innerHTML = ""; return; }
  box.innerHTML = res.map((p,i)=>`<button data-i="${i}"><span>${escapeHtml(pointName(p))}</span><span class="sg-pref">${escapeHtml(prefLabel(p.prefJa))}</span></button>`).join("");
  box.hidden = false;
  box.querySelectorAll("button").forEach(btn=>btn.addEventListener("click", ()=>{
    const p = res[+btn.dataset.i];
    box.hidden = true;
    document.getElementById("mapSearch").blur();
    if(!MAP_FILTERS.find(f=>f.id===mapState.filter).test(p)){ mapState.filter = "all"; renderMapChips(); }
    mapState.map.flyTo([p.lat,p.lng], 12);
    mapState.map.once("moveend", ()=>selectMapPoint(p));
  }));
}

function locateMe(){
  if(!navigator.geolocation){ setMapCount(t("locateFail")); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const c = [pos.coords.latitude, pos.coords.longitude];
    if(mapState.me) mapState.me.setLatLng(c);
    else mapState.me = L.marker(c,{icon:L.divIcon({className:"yn-icon", html:'<div class="me-dot"></div>', iconSize:null}), interactive:false, zIndexOffset:3000}).addTo(mapState.map);
    mapState.map.flyTo(c, 9);
  }, ()=>setMapCount(t("locateFail")), {enableHighAccuracy:false, timeout:8000});
}

function showMap(){
  window.scrollTo(0,0);
  updateLayoutVars();
  initMap();
  if(!mapState.map) return;
  if(!MAP_POINTS.length) buildMapPoints();
  requestAnimationFrame(()=>{ mapState.map.invalidateSize(); renderMapChips(); renderMapLayer(); });
}

function localToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return state.lang==="ja" ? `${y}年${m}月${d}日` : new Date(y,m-1,d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
}
function daysUntil(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((new Date(y,m-1,d) - now) / 86400000);
}
function dealCard(d){
  const r = d.resortId ? RESORTS.find(x=>x.id===d.resortId) : null;
  const title = state.lang==="ja" ? d.titleJa : (d.titleEn || d.titleJa);

  const soon = daysUntil(d.validUntil) <= 14;
  const where = r ? `${state.lang==="ja"?r.nameJa:r.nameEn} ・ ${prefLabel(r.prefJa)}` : t("dealNational");
  return `
    <div class="deal-card">
      <div class="deal-top"><span class="deal-cat ${escapeHtml(d.category)}">${t("dealCat_"+d.category) || escapeHtml(d.category)}</span><span class="deal-until ${soon?"soon":""}">${t("dealUntil")(fmtDate(d.validUntil))}</span></div>
      <h4>${escapeHtml(title)}</h4>
      <div class="deal-resort">${escapeHtml(where)}</div>
      <p class="deal-desc">${escapeHtml(desc)}</p>
      <a class="deal-link" href="${safeUrl(d.url)}" target="_blank" rel="noopener">${t("dealLink")}</a>
    </div>`;
}
function renderDeals(){
  const el = document.getElementById("dealsContent");
  const today = localToday();
  const active = DEALS.filter(d=>d && d.validUntil && d.validUntil>=today).sort((a,b)=>a.validUntil.localeCompare(b.validUntil));
  const national = active.filter(d=>!d.resortId);
  const perResort = active.filter(d=>d.resortId && RESORTS.some(r=>r.id===d.resortId));
  const stu = RESORTS.filter(r=>r.liftStudent && r.liftAdult).sort((a,b)=>(b.liftAdult-b.liftStudent)-(a.liftAdult-a.liftStudent));
  let html = "";
  if(national.length) html += `<div class="deal-section"><h3>${t("dealSecNational")}</h3><div class="deal-list">${national.map(dealCard).join("")}</div></div>`;
  if(perResort.length) html += `<div class="deal-section"><h3>${t("dealSecResort")}</h3><div class="deal-list">${perResort.map(dealCard).join("")}</div></div>`;
  if(!national.length && !perResort.length) html += `<div class="deal-section"><div class="deal-empty">${t("dealsEmpty")}</div></div>`;
  html += `<div class="deal-section"><h3>${t("dealSecStudent")}</h3><div class="deal-list">${stu.map(r=>`

    ${r.terrain ? `

    <div class="terrain-legend">${r.terrain.map((p,i)=>`<span><span class="swatch" style="background:${terrainColors[i]}"></span>${terrainLabels[i]} <span class="num">${p}%</span></span>`).join("")}</div>` : `
    <div class="terrain-legend">${t("terrainUnknown")}</div>`}
    <div class="section-label">${t("englishLabel")}</div>
    <p style="margin-top:0;margin-bottom:20px;font-size:13.5px;color:var(--text-muted);">${englishText}</p>
    <div class="section-label">${state.lang==="ja"?"周辺サービスへ送客":"Connect to nearby services"}</div>
    <div class="cta-grid">
      <div class="cta-card"><div class="cta-title">${icon("pin",16)} ${t("placeTitle")}</div><div class="cta-desc">${t("placeDesc")}</div><a class="cta-btn" href="https://www.google.com/maps/search/?api=1&query=${placeQuery}" target="_blank" rel="noopener">${t("placeBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("hotel",16)} ${t("lodgingTitle")}</div><div class="cta-desc">${t("lodgingDesc")}</div><a class="cta-btn" href="https://travel.rakuten.co.jp/dosearch/?f_keyword=${lodgingQuery}" target="_blank" rel="noopener">${t("lodgingBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("food",16)} ${t("foodTitle")}</div><div class="cta-desc">${t("foodDesc")}</div><a class="cta-btn" href="https://www.google.com/maps/search/${foodQuery}" target="_blank" rel="noopener">${t("foodBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("ski",16)} ${t("gearTitle")}</div><div class="cta-desc">${t("gearDesc")}</div><a class="cta-btn" href="https://search.rakuten.co.jp/search/mall/${gearQuery}/" target="_blank" rel="noopener">${t("gearBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("onsen",16)} ${t("onsenTitle")}</div><div class="cta-desc">${t("onsenDesc")}</div><a class="cta-btn" href="https://www.google.com/maps/search/${onsenQuery}" target="_blank" rel="noopener">${t("onsenBtn")}</a></div>
    </div>
    <div class="disclaimer">${t("disclaimer")}</div>
  `;
  document.getElementById("overlay").hidden = false;
  document.getElementById("closeBtn").addEventListener("click", closeDetail);
  document.getElementById("detailFav").addEventListener("click", ()=>{
    toggleFav(r.id);
    const on = isFav(r.id), b = document.getElementById("detailFav");
    b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; b.setAttribute("aria-pressed", on);
    if(state.view==="nearby") renderGrid();
  });
  sheet.scrollTop = 0;
}
function closeDetail(){ document.getElementById("overlay").hidden = true; }

function packingList(r){
  const items = [t("packBase"), t("packBase2"), t("packBase3"), t("packBase4")];
  if(wx(r).tempC!=null && wx(r).tempC <= -5){ items.push(t("packCold")); items.push(t("packCold2")); }
  if(wx(r).condJa.includes("雪") || wx(r).condJa.includes("パウダー")){ items.push(t("packSnow")); }
  return items;
}

function scoreResort(r, fromCityJa, levelIdx){
  let score = 0;
  if(r.cityJa === fromCityJa) score += 100;
  score -= r.distKm * 0.2;
  score += (r.terrain ? r.terrain[levelIdx] : 30) * 0.6;
  return score;
}

function computeRanking(){
  const pref = PREFECTURES[wiz.prefIdx];
  return RESORTS.map(r=>({r, s:scoreResort(r, pref.anchorJa, wiz.level)})).sort((a,b)=>b.s-a.s).map(x=>x.r);
}

function renderRecommendation(){
  const pref = PREFECTURES[wiz.prefIdx];
  const ranked = computeRanking();
  const notYetShown = ranked.find(r=>!wiz.shown.includes(r.id)) || ranked[0];
  wiz.lastId = notYetShown.id;
  wiz.shown.push(notYetShown.id);
  if(wiz.shown.length > RESORTS.length) wiz.shown = [notYetShown.id];

  const r = notYetShown;
  const name = state.lang==="ja" ? r.nameJa : r.nameEn;
  const city = state.lang==="ja" ? r.cityJa : r.cityEn;
  const prefName = state.lang==="ja" ? pref.ja : pref.en;
  const anchorName = state.lang==="ja" ? pref.anchorJa : pref.anchorEn;
  const time = state.lang==="ja" ? r.timeJa : r.timeEn;
  const cond = (state.lang==="ja" ? wx(r).condJa : wx(r).condEn) || t("weatherLoading");
  const tripLabel = t(TRIP_OPTS[wiz.trip]);
  const levelLabel = t(LEVEL_OPTS[wiz.level]);
  const isDayTrip = wiz.trip===0;
  const longTrip = r.distKm >= 100;
  const stayVerdict = (isDayTrip && !longTrip) ? t("stayDayOk") : (longTrip ? t("stayRecommend") : t("stayDayOk"));
  const packing = packingList(r);
  const accessLine = anchorName===city
    ? `${prefName} → ${name}・${time}`
    : `${prefName}（${state.lang==="ja"?"最寄りの拠点":"nearest hub"}: ${anchorName}）→ ${name}・${time}`;

  const box = document.getElementById("wizardResult");
  box.hidden = false;
  box.innerHTML = `
    <div class="reco-card">
      <div class="reco-eyebrow">${t("recoEyebrow")}</div>
      <h2>${name}</h2>
      <div class="reco-sub">${t("recoWhy")(tripLabel, levelLabel)}</div>
      ${pref.approx ? `<div class="reco-approx-note">${t("approxNote")}</div>` : ""}
      <div class="reco-rows">
        <div class="reco-row"><div class="ic">${icon("car",20)}</div><div><div class="rt">${t("rowAccess")}</div><div class="rv">${accessLine}${r.flight?`<br><span style="font-size:11.5px;color:var(--text-muted)">${t("flightNote")}</span>`:""}</div></div></div>
        <div class="reco-row"><div class="ic">${weatherIcon(wx(r).condJa)}</div><div><div class="rt">${t("rowWeather")}</div><div class="rv"><span class="num">${nv(wx(r).tempC,"°C")}</span>・${cond}・${t("depthLabel")} <span class="num">${nv(wx(r).depth,"cm")}</span></div></div></div>
        <div class="reco-row"><div class="ic">${icon("bed",20)}</div><div><div class="rt">${t("rowStay")}</div><div class="rv">${stayVerdict}</div></div></div>
        <div class="reco-row"><div class="ic">${icon("backpack",20)}</div><div style="flex:1"><div class="rt">${t("rowPacking")}</div><div class="packing-list">${packing.map(p=>`<span class="packing-item">${p}</span>`).join("")}</div></div></div>
      </div>
      <div class="reco-actions">
        <button class="reco-secondary-btn" id="anotherBtn">${icon("refresh",15)} ${t("another")}</button>
        <button class="reco-detail-btn" id="seeDetailBtn">${t("seeDetail")}</button>
      </div>
    </div>
    <button class="reco-secondary-btn" id="startOverBtn" style="width:100%">${t("startOver")}</button>
  `;
  document.getElementById("anotherBtn").addEventListener("click", renderRecommendation);
  document.getElementById("seeDetailBtn").addEventListener("click", ()=>openDetail(r.id));
  document.getElementById("startOverBtn").addEventListener("click", resetWizard);
  document.getElementById("wizardQuiz").hidden = true;
  box.scrollIntoView({behavior:"smooth", block:"start"});
}

function resetWizard(){
  wiz.block=null; wiz.prefIdx=null; wiz.trip=null; wiz.level=null; wiz.lastId=null; wiz.shown=[];
  document.getElementById("wizardResult").hidden = true;
  document.getElementById("wizardResult").innerHTML = "";
  document.getElementById("prefBlockWrap").hidden = true;
  document.getElementById("wizardQuiz").hidden = false;
  applyStaticText();
}

const VIEWS = [["wizard","navWizard","wizardView"],["map","navMap","mapView"],["nearby","navNearby","nearbyView"],["deals","navDeals","dealsView"],["gear","navGear","gearView"]];
function setView(view){
  state.view = view;
  VIEWS.forEach(([v,nav,el])=>{
    document.getElementById(nav).classList.toggle("active", v===view);
    document.getElementById(el).hidden = v!==view;
  });
  document.getElementById("searchRow").hidden = view!=="nearby";
  document.body.classList.toggle("map-mode", view==="map");
  if(view!=="map") document.getElementById("mapPreview").hidden = true;
  if(view==="nearby") renderGrid();
  if(view==="map") showMap();
  if(view==="deals") renderDeals();
  if(view==="gear") renderGearTab();
}

function render(){
  applyStaticText();
  if(state.view==="nearby") renderGrid();
  if(state.view==="map"){ renderMapChips(); renderMapLayer(); }
  if(state.view==="deals") renderDeals();
  if(state.view==="gear") renderGearTab();
  if(state.view==="wizard" && !document.getElementById("wizardResult").hidden && wiz.lastId){
    const idx = wiz.shown.indexOf(wiz.lastId);
    if(idx>-1) wiz.shown.splice(idx,1);
    renderRecommendation();
  }
}

document.getElementById("btnJa").addEventListener("click", ()=>{state.lang="ja"; render();});
document.getElementById("btnEn").addEventListener("click", ()=>{state.lang="en"; render();});
VIEWS.forEach(([v,nav])=>document.getElementById(nav).addEventListener("click", ()=>setView(v)));
document.getElementById("wizardSubmit").addEventListener("click", renderRecommendation);
document.getElementById("searchInput").addEventListener("input", (e)=>{state.query=e.target.value; renderGrid();});
document.getElementById("regionSelect").addEventListener("change", (e)=>{state.region=e.target.value; renderGrid();});
document.getElementById("sortSelect").addEventListener("change", (e)=>{state.sort=e.target.value; renderGrid();});
[["chipStudent","studentOnly"],["chipEnglish","englishOnly"],["chipFav","favOnly"]].forEach(([id,key])=>{
  document.getElementById(id).addEventListener("click", (e)=>{
    e.preventDefault();
    state[key] = !state[key];
    document.getElementById(id).classList.toggle("on", state[key]);
    renderGrid();
  });
});
document.getElementById("grid").addEventListener("click", (e)=>{
  const favBtn = e.target.closest("[data-fav]");
  if(favBtn){ toggleFav(favBtn.dataset.fav); renderGrid(); return; }
  const card = e.target.closest(".card");
  if(card) openDetail(card.dataset.id);
});
document.getElementById("grid").addEventListener("keydown", (e)=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const card = e.target.closest(".card");
  if(card && e.target===card){ e.preventDefault(); openDetail(card.dataset.id); }
});
document.getElementById("mapChips").addEventListener("click", (e)=>{
  const b = e.target.closest("[data-f]");
  if(!b) return;
  mapState.filter = b.dataset.f;
  closeMapPreview();
  renderMapChips(); renderMapLayer();
});
document.getElementById("mapSearch").addEventListener("input", renderSuggest);
document.getElementById("mapSearch").addEventListener("keydown", (e)=>{
  if(e.key==="Enter"){ const first = document.querySelector("#mapSuggest button"); if(first) first.click(); }
});
document.getElementById("mapZoomIn").addEventListener("click", ()=>mapState.map && mapState.map.zoomIn());
document.getElementById("mapZoomOut").addEventListener("click", ()=>mapState.map && mapState.map.zoomOut());
document.getElementById("mapLocate").addEventListener("click", locateMe);
window.addEventListener("resize", ()=>{ if(state.view==="map"){ updateLayoutVars(); mapState.map && mapState.map.invalidateSize(); } });
document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") closeDetail(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeDetail(); });

document.getElementById("icWizard").innerHTML = icon("sparkle", 20);
document.getElementById("icMap").innerHTML = icon("map", 20);
document.getElementById("icNearby").innerHTML = icon("search", 20);
document.getElementById("icDeals").innerHTML = icon("tag", 20);
document.getElementById("icGear").innerHTML = icon("backpack", 20);
document.getElementById("mapSearchIc").innerHTML = icon("search", 18);
document.getElementById("mapLocate").innerHTML = icon("locate", 20);

applyStaticText();
setView("wizard");
loadAllLiveWeather();
loadAllResorts().then(()=>{ renderHeroStat(); buildMapPoints(); if(state.view==="map") renderMapLayer(); });
loadDeals().then(()=>{ if(state.view==="deals") renderDeals(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW registration failed", err));
  });
}
</script>

</body></html>
